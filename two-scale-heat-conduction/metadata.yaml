name: Two-scale heat conduction
path: two-scale-heat-conduction
url: https://precice.org/tutorials-two-scale-heat-conduction.html

participants:
  - Macro
  - Micro-Manager

cases:
  macro-dumux:
    participant: Macro
    directory: ./macro-dumux
    run: ./run.sh
    component: dumux-adapter
  
  macro-nutils:
    participant: Macro
    directory: ./macro-nutils
    run: ./run.sh
    component: nutils-adapter

  micro-dumux:
    participant: Micro-Manager
    directory: ./micro-dumux
    run: source /home/precice/venv/bin/activate && ./run.sh -s
    component: dumux-adapter

  micro-dumux_parallel:
    participant: Micro-Manager
    directory: ./micro-dumux
    run: source /home/precice/venv/bin/activate && ./run.sh -p 2
    component: dumux-adapter

  micro-nutils:
    participant: Micro-Manager
    directory: ./micro-nutils
    run: ./run.sh -s
    component: micro-manager