name: System tests (PR)

on:
  pull_request:
    types: [labeled]
    
jobs:
  run-system-tests:
    name: Trigger system tests
    if: ${{ github.event.label.name == 'trigger-system-tests' }}
    uses: ./.github/workflows/system-tests.yml
    with:
      suites: release
      build_args: "TUTORIALS_REF:${{ github.event.pull_request.head.sha }}"
