name: Run Testsuite (manual) # Unfortunately, we cannot modify the name: https://github.community/t/github-actions-dynamic-name-of-the-workflow-with-workflow-dispatch/150327
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Test suites to execute (comma-separated)'
        required: true
        default: 'release_test'
        type: string
      build_args:
        description: 'Build arguments (override component defaults)'
        default: 'PRECICE_REF:v3.4.1,TUTORIALS_REF:develop'
        type: string
      system_tests_branch:
        description: 'Git ref for tools/tests/'
        default: 'develop'
        type: string
      upload_artifacts:
        description: 'Upload the complete case files also on success (always true for failure)'
        default: 'TRUE'
        type: choice
        options:
            - 'FALSE'
            - 'TRUE'
      log_level:
        description: 'Logging verbosity of systemtests.py'
        default: 'INFO'
        type: choice
        options:
            - 'INFO'
            - 'DEBUG'


jobs:
  run_testsuite_manual:
    uses: ./.github/workflows/run_testsuite_workflow.yml
    with: 
      suites: ${{ inputs.suites }}
      build_args: ${{ inputs.build_args }}
      system_tests_branch: ${{ inputs.system_tests_branch }}
      log_level: ${{ inputs.log_level }}
      upload_artifacts: ${{ inputs.upload_artifacts }}
