name: Generate reference results (manual)
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated test suites to generate reference results for'
        default: ''
        required: false
        type: string
      commit_msg:
        description: 'Commit message'
        default: "Add reference results"
        type: string
      from_ref:
        description: 'Git ref for tools/tests/'
        required: true
        type: string
      clean_docker:
        description: 'Run docker-system-prune before running'
        default: 'FALSE'
        type: choice
        options:
            - 'FALSE'
            - 'TRUE'
      log_level:
        description: 'Logging verbosity of systemtests.py'
        default: 'INFO'
        required: true
        type: choice
        options:
            - 'INFO'
            - 'DEBUG'

jobs:
  generate_reference_results_manual:
    uses: ./.github/workflows/generate_reference_results_workflow.yml
    with: 
      from_ref: ${{ inputs.from_ref }}
      commit_msg: ${{ inputs.commit_msg }}
      suites: ${{ inputs.suites }}
      clean_docker: ${{ inputs.clean_docker }}
      log_level: ${{ inputs.log_level }}